name: publicar imagen en Docker Hub

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:

  #EJECUTAR PRUEBAS

  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secreta_adso_123
          MYSQL_DATABASE: adso_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psecreta_adso_123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Instalar cliente MySQL
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Esperar a MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uroot -psecreta_adso_123 && break
            sleep 2
          done

      - name: Crear tabla de aprendices
        run: |
          mysql -h 127.0.0.1 -uroot -psecreta_adso_123 adso_db < init.sql

      - name: Ejecutar pruebas con pytest
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: secreta_adso_123
          DB_NAME: adso_db
        run: |
          pytest

  # CONSTRUIR Y DESPLEGAR

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: alexismoreno1234/proyecto:latest

      - name: Desplegar en servidor cloud
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ubuntu
          TARGET: /home/ubuntu/link-de-despliegue/
          SCRIPT_AFTER: |
            cd /home/ubuntu/link-de-despliegue
            docker-compose pull
            docker-compose up -d
