name: publicar imagen en Docker Hub

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  #ejecutar pruebas
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Ejecutar pruebas con pytest
        run: |
          pytest 




  #contruir y desplegar
  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: alexismoreno1234/proyecto:latest

      - name: Desplegar en servidor cloud
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ubuntu
          TARGET: /home/ubuntu/link-de-despliegue/
          SCRIPT_AFTER: |
            cd /home/ubuntu/link-de-despliegue
            docker-compose pull
            docker-compose up -d
